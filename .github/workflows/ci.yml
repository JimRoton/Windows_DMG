# Continuous integration for Windows_DMG.
#
# Five jobs, each earning its place:
#
#   core              macOS  - proves Dmg.Core stayed portable
#   windows           Windows - builds everything, runs the unit suites
#   e2e               Windows - real AttachVirtualDisk mounts
#   publish           Windows - NativeAOT publish of dmg.exe, win-x64 + win-arm64
#   dependency-guard  Linux  - no third-party packages under src/
#
# CI ONLY. Nothing here pushes, tags, releases or deploys - packaging and
# release automation is S10.2 and lives in its own workflow file. `publish`
# proves the NativeAOT binaries build and the x64 one runs; it does not
# publish anything outside this workflow run's own artifacts.
#
# ---------------------------------------------------------------------------
# THE ZERO-TEST GATE (S1.7)
#
# `dotnet test` exits 0 when a project discovers NO tests - confirmed on SDK
# 10.0.301. A suite that silently stops being discovered (a broken
# `<IsTestProject>`, a missing xunit runner, a filter that matches nothing, a
# renamed namespace) therefore reports success, and the job goes green having
# proved nothing at all. That is the worst possible failure mode for CI: the
# signal disappears without anyone being told.
#
# So every test step below writes a TRX and then asserts that the number of
# EXECUTED tests is greater than zero. If a suite runs no tests the job fails
# and says so. The count comes from the TRX <Counters executed="N"> attribute
# rather than from parsing console text, because the TRX is a stable machine
# format and the console summary is not.
#
# The gate is repeated inline in each step on purpose: a shared script would
# have to live outside .github/workflows/, and one legible block per step keeps
# the failure visible in the log right where it happened.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The repo targets .NET 10. There is no global.json today; if one is ever
  # added, swap `dotnet-version` below for `global-json-file: global.json`
  # so the pin lives in exactly one place.
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # core - the portability gate.
  #
  # This job is NOT a duplicate of `windows`. It is the enforcement mechanism
  # for the rule that Dmg.Core has no Windows dependency: Dmg.Core targets
  # plain net10.0 and its tests must build and pass on a machine that has no
  # virtdisk.dll and no Windows API at all. If someone reaches for a Windows
  # API in Dmg.Core - a net*-windows TFM, a P/Invoke, a reference to
  # Dmg.Windows - this job goes red. Do not "fix" that by moving the job to
  # Windows; fix the dependency.
  # ---------------------------------------------------------------------------
  core:
    name: core (macOS - portability gate)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Only the portable projects are touched here on purpose: building the
      # whole solution would drag in the net10.0-windows projects and dilute
      # the signal this job exists to produce.
      - name: Restore
        run: dotnet restore tests/Dmg.Core.Tests/Dmg.Core.Tests.csproj

      - name: Build
        run: dotnet build tests/Dmg.Core.Tests/Dmg.Core.Tests.csproj --configuration Release --no-restore

      # Fixture-dependent suites (conformance, encrypted round-trip, hostile
      # corpus) skip themselves when their inputs are absent, which lets the
      # job go green having exercised nothing. Generating the fixtures here is
      # what turns those suites on. macOS is required for this: hdiutil is not
      # available on any other runner OS.
      #
      # Not cached: hdiutil bakes a fresh UUID into every image it writes, so
      # a cached fixtures/generated (or a manifest.json derived from it) would
      # go stale the moment it was reused across runs. Regenerate every time.
      - name: Generate DMG fixtures
        shell: bash
        run: |
          set -euo pipefail
          tools/make-fixtures.sh

      - name: Generate fixture manifest
        shell: bash
        run: |
          set -euo pipefail
          tools/make-manifest.sh

      - name: Generate hostile corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/make-hostile-corpus.py

      - name: Test Dmg.Core.Tests
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts/trx/core
          dotnet test tests/Dmg.Core.Tests/Dmg.Core.Tests.csproj \
            --configuration Release --no-build \
            --logger "trx;LogFileName=core.trx" \
            --results-directory artifacts/trx/core

          # --- zero-test gate: see THE ZERO-TEST GATE at the top of this file.
          trx=$(find artifacts/trx/core -name '*.trx' -type f | head -1 || true)
          if [ -z "$trx" ]; then
            echo "::error::Dmg.Core.Tests produced no TRX file, so the run cannot be verified."
            exit 1
          fi

          executed=$(grep -o 'executed="[0-9]*"' "$trx" | head -1 | tr -dc '0-9' || true)
          executed=${executed:-0}
          echo "Dmg.Core.Tests executed $executed test(s)."

          if [ "$executed" -lt 1 ]; then
            echo "::error::Dmg.Core.Tests discovered 0 tests. dotnet test exits 0 in that case, so this job would otherwise have passed vacuously."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # windows - full solution build plus the unit suites.
  # ---------------------------------------------------------------------------
  windows:
    name: windows (build + unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Windows_DMG.sln

      - name: Build solution
        run: dotnet build Windows_DMG.sln --configuration Release --no-restore

      - name: Test Dmg.Core.Tests
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts/trx/core
          dotnet test tests/Dmg.Core.Tests/Dmg.Core.Tests.csproj \
            --configuration Release --no-build \
            --logger "trx;LogFileName=core.trx" \
            --results-directory artifacts/trx/core

          # --- zero-test gate: see THE ZERO-TEST GATE at the top of this file.
          trx=$(find artifacts/trx/core -name '*.trx' -type f | head -1 || true)
          if [ -z "$trx" ]; then
            echo "::error::Dmg.Core.Tests produced no TRX file, so the run cannot be verified."
            exit 1
          fi

          executed=$(grep -o 'executed="[0-9]*"' "$trx" | head -1 | tr -dc '0-9' || true)
          executed=${executed:-0}
          echo "Dmg.Core.Tests executed $executed test(s)."

          if [ "$executed" -lt 1 ]; then
            echo "::error::Dmg.Core.Tests discovered 0 tests. dotnet test exits 0 in that case, so this job would otherwise have passed vacuously."
            exit 1
          fi

      - name: Test Dmg.Windows.Tests
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts/trx/windows
          dotnet test tests/Dmg.Windows.Tests/Dmg.Windows.Tests.csproj \
            --configuration Release --no-build \
            --logger "trx;LogFileName=windows.trx" \
            --results-directory artifacts/trx/windows

          # --- zero-test gate: see THE ZERO-TEST GATE at the top of this file.
          trx=$(find artifacts/trx/windows -name '*.trx' -type f | head -1 || true)
          if [ -z "$trx" ]; then
            echo "::error::Dmg.Windows.Tests produced no TRX file, so the run cannot be verified."
            exit 1
          fi

          executed=$(grep -o 'executed="[0-9]*"' "$trx" | head -1 | tr -dc '0-9' || true)
          executed=${executed:-0}
          echo "Dmg.Windows.Tests executed $executed test(s)."

          if [ "$executed" -lt 1 ]; then
            echo "::error::Dmg.Windows.Tests discovered 0 tests. dotnet test exits 0 in that case, so this job would otherwise have passed vacuously."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # e2e - genuine mounts (S10.4).
  #
  # GitHub's windows-latest runners already run as administrator, so
  # AttachVirtualDisk succeeds and the suite can mount real images. That is the
  # only reason end-to-end testing is viable without a self-hosted machine.
  #
  # Dmg.E2E.Tests drives the real, compiled dmg.exe against the small fixtures
  # checked into tests/Dmg.E2E.Tests/Fixtures/ (Windows runners have no hdiutil
  # to generate the gitignored corpus themselves). It is gated exactly like the
  # core and windows jobs above: the old "not present yet" tolerance for a
  # missing project directory is gone along with the project's absence, and a
  # run that executes zero tests now fails the job instead of passing
  # silently - see THE ZERO-TEST GATE at the top of this file.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (Windows - real mounts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # E2E drives the built dmg.exe, so the whole solution has to be built.
      - name: Restore
        run: dotnet restore Windows_DMG.sln

      - name: Build solution
        run: dotnet build Windows_DMG.sln --configuration Release --no-restore

      - name: Test Dmg.E2E.Tests
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts/trx/e2e
          dotnet test tests/Dmg.E2E.Tests/Dmg.E2E.Tests.csproj \
            --configuration Release --no-build \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory artifacts/trx/e2e

          # --- zero-test gate: see THE ZERO-TEST GATE at the top of this file.
          trx=$(find artifacts/trx/e2e -name '*.trx' -type f | head -1 || true)
          if [ -z "$trx" ]; then
            echo "::error::Dmg.E2E.Tests produced no TRX file, so the run cannot be verified."
            exit 1
          fi

          executed=$(grep -o 'executed="[0-9]*"' "$trx" | head -1 | tr -dc '0-9' || true)
          executed=${executed:-0}
          echo "Dmg.E2E.Tests executed $executed test(s)."

          if [ "$executed" -lt 1 ]; then
            echo "::error::Dmg.E2E.Tests discovered 0 tests. dotnet test exits 0 in that case, so this job would otherwise have passed vacuously."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # publish - NativeAOT publish of src/Dmg.Cli (S10.1).
  #
  # Proves the win-x64 and win-arm64 NativeAOT publishes actually produce a
  # working single-file dmg.exe. We cannot cross-compile NativeAOT on macOS
  # (the analyzers run everywhere, but the native linker step needs a real
  # Windows toolchain), so this job on windows-latest is the only place that
  # exercises the publish end to end.
  #
  # win-arm64 cannot run on this x64 runner, so only the win-x64 binary is
  # executed; the arm64 one is proved by the publish succeeding and its size
  # being printed alongside x64's.
  #
  # This is CI validation only - it uploads workflow artifacts for inspection,
  # it does not attach anything to a release. S10.2's tag-triggered workflow
  # owns that.
  # ---------------------------------------------------------------------------
  publish:
    name: publish (NativeAOT dmg.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish win-x64
        run: >
          dotnet publish src/Dmg.Cli/Dmg.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish/win-x64

      - name: Publish win-arm64
        run: >
          dotnet publish src/Dmg.Cli/Dmg.Cli.csproj
          --configuration Release
          --runtime win-arm64
          --self-contained true
          --output artifacts/publish/win-arm64

      - name: Run dmg.exe version (win-x64) and print binary sizes
        shell: pwsh
        run: |
          $x64 = "artifacts/publish/win-x64/dmg.exe"
          $arm64 = "artifacts/publish/win-arm64/dmg.exe"

          if (-not (Test-Path $x64)) {
            Write-Error "win-x64 publish did not produce $x64"
            exit 1
          }
          if (-not (Test-Path $arm64)) {
            Write-Error "win-arm64 publish did not produce $arm64"
            exit 1
          }

          # win-arm64 cannot execute on this x64 runner - only win-x64 is run.
          & $x64 version
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "dmg.exe version exited $exitCode, expected 0"
            exit 1
          }
          Write-Host "dmg.exe version (win-x64) exited 0 as expected."

          $x64Size = (Get-Item $x64).Length
          $arm64Size = (Get-Item $arm64).Length
          Write-Host ("dmg.exe (win-x64):   {0} bytes" -f $x64Size)
          Write-Host ("dmg.exe (win-arm64): {0} bytes" -f $arm64Size)

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-win-x64
          path: artifacts/publish/win-x64/dmg.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-win-arm64
          path: artifacts/publish/win-arm64/dmg.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # dependency-guard - ADR-002, zero third-party dependencies.
  #
  # Nothing under src/ may carry a PackageReference. Test projects under tests/
  # are exempt: they legitimately reference xunit and the test SDK, none of
  # which ships in the product binary.
  # ---------------------------------------------------------------------------
  dependency-guard:
    name: dependency-guard (no packages under src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for PackageReference under src/
        shell: bash
        run: |
          set -euo pipefail

          # Build files only - a PackageReference in a .cs comment is not a
          # dependency, and matching one would just be noise.
          offenders=$(grep -rn --include='*.csproj' \
                              --include='*.props' \
                              --include='*.targets' \
                              -E '<PackageReference[[:space:]>]' src/ || true)

          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo
            cat <<'MESSAGE'
          ============================================================
          dependency-guard FAILED

          A PackageReference was found in a project under src/. The lines
          above show exactly where.

          Windows_DMG ships as a single self-contained NativeAOT binary with
          zero third-party runtime dependencies. Everything the product needs
          - the DMG format work, compression, hashing, and the virtdisk.dll
          P/Invoke layer - is written against the .NET base class library and
          the Windows API directly. That is a deliberate architectural
          decision, not an oversight: see

              docs/adr/ADR-002-zero-third-party-dependencies.md

          for the reasoning and the consequences.

          How to resolve this:

            * Implement it against the BCL, or P/Invoke the Windows API from
              src/Dmg.Windows, instead of taking the package.
            * If the dependency is genuinely unavoidable, that is an
              architectural change: amend or supersede ADR-002 first, then
              relax this guard in the same pull request.

          Test projects under tests/ are exempt - they may reference xunit and
          the test SDK, since none of that reaches the shipped binary.
          ============================================================
          MESSAGE
            exit 1
          fi

          echo "No PackageReference found under src/ - ADR-002 holds."
